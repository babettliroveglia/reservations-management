# Front door for the trial: passes everything to OpenResto's own proxy (port 8000 in the pod) and adds
# the Tenuta Roveglia theme (fonts and colours) to every page. OpenResto itself is not modified.

server {
    listen 80;
    server_name _;
    client_max_body_size 12m;

    # Our theme: stylesheet, fonts, logo.
    location /roveglia/ {
        alias /srv/roveglia/;
        add_header Cache-Control "no-cache";
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;

        # Uncompressed responses, so the theme link can be added to the HTML.
        proxy_set_header Accept-Encoding "";
        sub_filter_types text/html;
        sub_filter_once on;
        sub_filter '</head>' '<link rel="stylesheet" href="/roveglia/theme.css"></head>';
    }
}
