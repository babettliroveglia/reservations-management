# The staff admin Worker (src/admin.ts, pages in admin-public/), on the same D1 database as the public
# Worker. Protected by Cloudflare Access: see README.md. Without ACCESS_TEAM_DOMAIN and ACCESS_AUD it
# refuses every request.
name = "prenota-admin-test"
main = "src/admin.ts"
compatibility_date = "2026-10-01"

[assets]
directory = "admin-public"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "prenota-test"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[observability]
enabled = true

# [vars]
# ACCESS_TEAM_DOMAIN = "<team>.cloudflareaccess.com"
# ACCESS_AUD = "<the Access application's AUD tag>"
